<!DOCTYPE html>
<html lang="fi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Turtle-koulu – Piirrä Pythonilla!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js"></script>
<style>
:root {
    --bg: #0a0e15;
    --surface: #12181f;
    --surface2: #1a2230;
    --text: #e0e6f0;
    --text-dim: #7a8490;
    --primary: #e2b714;
    --blue: #4fc3f7;
    --green: #00d26a;
    --red: #ff6b6b;
    --purple: #b388ff;
    --radius: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Nunito', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow: hidden;
}
/* ── Loading ── */
#loading-screen {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; z-index: 999;
}
.loading-content { text-align: center; }
.loading-content h1 { font-family: 'Fredoka One', cursive; font-size: 1.8rem; margin-bottom: 0.5rem; }
.loading-bar {
    width: 250px; height: 6px; background: var(--surface2);
    border-radius: 3px; overflow: hidden; margin-top: 1rem;
}
.loading-bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, var(--primary), var(--blue));
    animation: load 3s ease-in-out forwards;
}
@keyframes load { to { width: 100%; } }

/* ── Header ── */
#top-bar {
    background: var(--surface);
    padding: 10px 20px;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #ffffff10;
    height: 50px;
}
#top-bar h1 { font-family: 'Fredoka One', cursive; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
#top-bar .step-indicator { font-size: 0.9rem; color: var(--text-dim); }

/* ── Main Layout ── */
#main-container {
    display: flex;
    height: calc(100vh - 100px);
}
#instructions-pane {
    width: 40%; min-width: 300px;
    background: var(--surface);
    padding: 24px;
    overflow-y: auto;
    border-right: 1px solid #ffffff10;
}
#instructions-pane h3 { font-size: 1.3rem; color: var(--primary); margin-bottom: 0.5rem; }
#instructions-pane .step-title { font-family: 'Fredoka One', cursive; font-size: 1.5rem; margin-bottom: 1rem; }
#instructions-pane .theory { margin-bottom: 1.2rem; line-height: 1.6; }
#instructions-pane .theory code {
    background: var(--surface2); color: var(--blue);
    padding: 2px 6px; border-radius: 4px; font-size: 0.9rem;
}
#instructions-pane .example-box {
    background: var(--bg); border: 1px solid #ffffff10;
    border-radius: var(--radius); padding: 14px; margin-bottom: 1.2rem;
    overflow-x: auto;
}
#instructions-pane .example-box pre {
    font-family: 'Courier New', monospace; font-size: 0.85rem;
    color: var(--green); white-space: pre-wrap; word-break: break-word;
}
#instructions-pane .task-box {
    background: var(--surface2); border-left: 3px solid var(--primary);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 12px 16px; margin-bottom: 1rem;
}
#instructions-pane .task-box h4 { color: var(--primary); margin-bottom: 6px; }
#instructions-pane .hint-box {
    color: var(--text-dim); font-size: 0.85rem;
    padding: 8px 12px; border-radius: var(--radius);
    background: var(--bg); margin-top: 0.5rem;
}

#editor-pane {
    flex: 1; padding: 20px;
    display: flex; flex-direction: column;
    overflow-y: auto;
}
#code-editor {
    width: 100%; min-height: 180px;
    background: var(--bg); color: var(--blue);
    border: 1px solid #ffffff10; border-radius: var(--radius);
    padding: 16px; font-family: 'Courier New', monospace;
    font-size: 0.9rem; resize: vertical;
    outline: none;
}
#code-editor:focus { border-color: var(--primary); }
.editor-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface2); padding: 8px 14px;
    border-radius: var(--radius) var(--radius) 0 0;
    margin-bottom: -1px;
}
.editor-toolbar span { font-weight: 700; font-size: 0.9rem; color: var(--text-dim); }
.btn-clear, .btn-run {
    padding: 6px 14px; border: none; border-radius: 6px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.85rem;
    cursor: pointer; transition: background 0.2s;
}
.btn-clear { background: var(--surface2); color: var(--text-dim); }
.btn-clear:hover { background: #2a3545; }
.btn-run {
    background: var(--primary); color: var(--bg);
    margin-left: 8px;
}
.btn-run:hover { background: #ffd633; }

#feedback-box {
    margin-top: 10px; padding: 10px 14px; border-radius: var(--radius);
    font-weight: 600; font-size: 0.9rem; display: none;
}
#feedback-box.success { background: #0d3b1a; color: var(--green); display: block; }
#feedback-box.hint { background: #3b2f0d; color: var(--primary); display: block; }

#turtle-canvas-wrap {
    margin-top: 15px;
    background: var(--surface); border: 1px solid #ffffff10;
    border-radius: var(--radius); overflow: hidden;
}
#turtle-canvas-wrap .editor-toolbar {
    border-radius: 0; border-bottom: 1px solid #ffffff10;
}
#turtle-canvas {
    display: block; width: 100%; max-width: 600px;
    height: auto; background: #0d1117; margin: 0 auto;
}

/* ── Footer Nav ── */
#bottom-bar {
    background: var(--surface);
    border-top: 1px solid #ffffff10;
    padding: 12px 20px;
    display: flex; align-items: center; justify-content: space-between;
    height: 50px;
}
.btn-nav {
    padding: 8px 18px; border: none; border-radius: var(--radius);
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 0.9rem;
    cursor: pointer; transition: background 0.2s;
    background: var(--surface2); color: var(--text);
}
.btn-nav:hover { background: #2a3545; }
.btn-nav:disabled { opacity: 0.3; cursor: default; }

.step-dots { display: flex; gap: 6px; align-items: center; }
.step-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--surface2); cursor: pointer; transition: background 0.2s;
}
.step-dot.active { background: var(--primary); }
.step-dot.done { background: var(--blue); }
.step-dot.passed { background: var(--green); }
.step-dot.passed::after { content: '✅'; font-size: 8px; position: absolute; top: -4px; left: -4px; }

#confetti-canvas {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 9999;
}

/* ── Responsive ── */
@media (max-width: 768px) {
    #main-container { flex-direction: column; height: auto; overflow: auto; }
    #instructions-pane { width: 100%; min-width: 0; border-right: none; border-bottom: 1px solid #ffffff10; }
    #editor-pane { flex: none; }
    body { overflow: auto; }
}
</style>
</head>
<body>

<div id="loading-screen">
    <div class="loading-content">
        <h1>🐢 Turtle-koulu</h1>
        <p>Ladataan Python-moottoria...</p>
        <div class="loading-bar"><div class="loading-bar-fill"></div></div>
    </div>
</div>

<div id="app" style="display:none;">
    <header id="top-bar">
        <h1>🐢 Turtle-koulu</h1>
        <span class="step-indicator" id="step-label">Vaihe 1 / 30</span>
    </header>

    <div id="main-container">
        <section id="instructions-pane">
            <div class="step-title" id="step-title"></div>
            <div class="theory" id="step-theory"></div>
            <div class="example-box" id="step-example"></div>
            <div class="task-box">
                <h4>🎯 Tehtäväsi</h4>
                <p id="step-task"></p>
                <div class="hint-box" id="step-hint"></div>
            </div>
        </section>

        <section id="editor-pane">
            <div class="editor-toolbar">
                <span>🖊️ Koodieditori</span>
                <div>
                    <button class="btn-clear" onclick="clearWorkspace()">🔄 Tyhjennä</button>
                    <button class="btn-run" onclick="runCode()">▶️ Suorita</button>
                </div>
            </div>
            <textarea id="code-editor" spellcheck="false"></textarea>
            <div id="feedback-box"></div>

            <div id="turtle-canvas-wrap">
                <div class="editor-toolbar">
                    <span style="color:var(--green);">🐢 Piirros</span>
                    <button class="btn-clear" onclick="clearCanvas()" style="font-size:0.8rem;">🔄 Tyhjennä</button>
                </div>
                <canvas id="turtle-canvas" width="600" height="400"></canvas>
            </div>
        </section>
    </div>

    <footer id="bottom-bar">
        <button class="btn-nav" onclick="prevStep()" id="btn-prev">◀ Edellinen</button>
        <div class="step-dots" id="step-dots"></div>
        <button class="btn-nav" onclick="nextStep()" id="btn-next">Seuraava ▶</button>
    </footer>
</div>

<script>
// ═══════════════════════════════════════
//  TURTLE-KOULU — 10 Steps
// ═══════════════════════════════════════
const STEPS = [
    {
        title: "1. Konna liikkeelle 🐢",
        theory: `<p>Turtle-konna on piirrosrobotti. Se osaa liikkua eteenpäin ja jättää viivan peräänsä — aivan kuten kynä paperilla!</p>
<p>Komento <code>forward(100)</code> piirtää 100 pikseliä pitkän viivan suoraan eteenpäin. Konna aloittaa <strong>canvasin keskeltä</strong> ja katsoo oikealle.</p>`,
        example: `<pre># Piirrä yksi viiva:
forward(100)</pre>`,
        task: "Kirjoita <code>forward(100)</code> ja paina <strong>Suorita</strong>. Sitten kokeile eri lukuja (30, 150, 200).",
        hint: "💡 Kokeile eri lukuja: forward(30), forward(150), forward(200). Mitä tapahtuu?",
        starterCode: "# Piirrä viiva:\n",
        validate(log, lines) {
            if (lines.length < 1) return { ok: false, msg: "💡 Et ole vielä piirtänyt viivaa. Kirjoita <code>forward(100)</code> ja paina Suorita!" };
            return { ok: true, msg: "✅ Piirsit viivan! Hyvä alku! Kokeile eri lukuja ja siirry sitten eteenpäin." };
        }
    },
    {
        title: "2. Kääntyminen ↔️",
        theory: `<p>Konna osaa myös kääntyä! <code>left(90)</code> kääntää 90 astetta vastapäivään. <code>right(90)</code> kääntää myötäpäivään.</p>
<p>Täysi ympyrä on 360°. 90° on neljännesympyrä — eli <strong>suorakulma</strong>.</p>
<p>Jos piirrät viivan, käännät 90° ja piirrät toisen viivan — saat L-kirjaimen!</p>`,
        example: `<pre># Piirrä kaksi viivaa 90° kulmassa:
forward(100)
left(90)
forward(50)</pre>`,
        task: "Piirrä <strong>kaksi viivaa eri suuntiin</strong> käyttäen <code>left(90)</code> tai <code>right(90)</code>. L-kirjain riittää!",
        hint: "💡 forward(100), left(90), forward(50) tekee L-kirjaimen.",
        starterCode: "# Piirrä kaksi viivaa eri suuntiin:\n",
        validate(log, lines) {
            if (lines.length < 2) return { ok: false, msg: "💡 Tarvitset kaksi viivaa! Kirjoita forward, sitten left(90), sitten toinen forward." };
            const angles = lines.map(l => Math.round(l.angle % 360 / 10) * 10);
            const unique = new Set(angles);
            if (unique.size < 2) return { ok: false, msg: "💡 Viivojen pitää olla eri suuntiin! Lisää <code>left(90)</code> ennen toista viivaa." };
            return { ok: true, msg: "✅ Piirsit kaksi viivaa eri suuntiin! Tästä se lähtee." };
        }
    },
    {
        title: "3. Silmukka 🔁",
        theory: `<p>Entä jos haluat piirtää <strong>monta viivaa</strong> yhdellä kertaa? Tähän tarvitaan <strong>silmukkaa</strong>!</p>
<p>Silmukka <code>for i in range(8):</code> toistaa sisällä olevat komennot 8 kertaa. Jokaisella kierroksella piirrät viivan ja käännät:</p>`,
        example: `<pre># Piirrä 8 viivaa — näyttää melkein ympyrältä!
for i in range(8):
    forward(50)
    left(45)   # 360 / 8 = 45 astetta</pre>`,
        task: "Käytä <strong>silmukkaa</strong> piirtääksesi vähintään 6 viivaa. Kokeile eri lukuja <code>range(6)</code>, <code>range(8)</code>, <code>range(12)</code> ja muuta kulmaa!",
        hint: "💡 for i in range(8): forward(50); left(45). Kokeile left(60) ja range(6)!",
        starterCode: "# Piirrä monta viivaa silmukalla:\n",
        validate(log, lines) {
            if (lines.length < 6) return { ok: false, msg: `💡 Piirsit ${lines.length} viivaa. Tarvitaan vähintään 6! Kokeile range(8) ja left(45).` };
            return { ok: true, msg: `✅ Piirsit ${lines.length} viivaa silmukalla! Hienoa logiikkaa!` };
        }
    },
    {
        title: "4. Neliö 🔲",
        theory: `<p>Neliössä on <strong>4 samanpituista sivua</strong> ja jokainen kulma on <strong>90°</strong>. Täydellinen silmukkatehtävä!</p>
<p>Silmukka toistaa samaa 4 kertaa: piirrä viiva, käännä 90°. Tuloksena on neliö.</p>`,
        example: `<pre># Neliö: 4 kertaa forward + left(90)
for i in range(4):
    forward(80)
    left(90)</pre>`,
        task: "Piirrä <strong>neliö</strong> käyttäen silmukkaa. Kokeile eri kokoja: 50, 100, 150!",
        hint: "💡 for i in range(4): forward(80); left(90). Kokeile eri kokoja!",
        starterCode: "# Piirrä neliö:\n",
        validate(log, lines) {
            if (lines.length < 4) return { ok: false, msg: `💡 Neliössä on 4 sivua. Piirsit ${lines.length}. Tarvitset range(4)!` };
            const has90 = lines.some(l => {
                const a = Math.round(l.angle % 360 / 10) * 10;
                return a === 90 || a === 270 || a === -90;
            });
            if (!has90) return { ok: false, msg: "💡 Neliön kulmat ovat 90°. Käytä <code>left(90)</code> tai <code>right(90)</code>!" };
            return { ok: true, msg: "✅ Piirsit neliön! Täydellinen!" };
        }
    },
    {
        title: "5. Oma funktio 🧩",
        theory: `<p>Funktio on kuin <strong>resepti</strong> — kirjoitat ohjeen kerran ja voit käyttää sitä uudelleen ja uudelleen!</p>
<p><code>def nelio():</code> luo uuden funktion. Sen sisällä voit kirjoittaa mitä tahansa koodia. Kun kirjoitat <code>nelio()</code>, kaikki funktion sisällä oleva koodi suoritetaan.</p>
<p>Jos kutsut <code>nelio()</code>-funktiota kaksi kertaa peräkkäin, <strong>toinen neliö piirtyy samalle paikalle</strong> ensimmäisen päälle. Saadaksesi kaksi erillistä neliötä, <strong>siirrä konnaa niiden välissä</strong> käyttäen <code>penup()</code> (nosta kynä) ja <code>goto(x, y)</code> (siirry uuteen paikkaan).</p>`,
        example: `<pre># Luo funktio — "neliön resepti"
def nelio():
    for i in range(4):
        forward(80)
        left(90)

# Piirrä eka neliö
nelio()

# Siirry sivuun ennen toista neliötä
penup()
goto(150, 150)
pendown()

# Piirrä toinen neliö — eri paikassa!
nelio()</pre>`,
        task: "Luo funktio nimeltä <code>nelio()</code>. Kutsu sitä <strong>kaksi kertaa</strong>, mutta <strong>siirrä konnaa välissä</strong> — muuten neliöt piirtyvät päällekkäin!",
        hint: "💡 def nelio(): ... sitten nelio(), penup(), goto(150, 150), pendown(), nelio(). goto() siirtää konnan uuteen paikkaan!",
        starterCode: `# Kääri tämä neliö funktion sisään:\nfor i in range(4):\n    forward(80)\n    left(90)\n\n# 1. Lisää def nelio(): ympärille\n# 2. Kutsu nelio() kahdesti\n# 3. Siirrä konnaa penup()/goto()/pendown() välissä\n`,
        validate(log, lines) {
            if (lines.length < 8) return { ok: false, msg: `💡 Piirsit ${lines.length} viivaa. Kutsu nelio()-funktiota kahdesti, jotta saat 8 viivaa!` };
            const has90 = lines.some(l => {
                const a = Math.round(l.angle % 360 / 10) * 10;
                return a === 90 || a === 270 || a === -90;
            });
            if (!has90) return { ok: false, msg: "💡 Neliön sisällä täytyy olla 90° kulmat. Varmista left(90) funktion sisällä." };
            return { ok: true, msg: "✅ Funktio toimii! Olet juuri luonut oman Python-komennon!" };
        }
    },
    {
        title: "6. Parametri: koko 📏",
        theory: `<p>Entä jos haluat eri kokoisia neliöitä? <strong>Parametri</strong> on syöte funktioon — voit kertoa funktiolle, minkä kokoisen neliön haluat!</p>
<p><code>def nelio(koko):</code> — <code>koko</code> on parametri. Kun kutsut <code>nelio(50)</code>, funktio käyttää arvoa 50. Kun kutsut <code>nelio(100)</code>, funktio käyttää arvoa 100.</p>`,
        example: `<pre># Funktio parametrilla
def nelio(koko):
    for i in range(4):
        forward(koko)
        left(90)

nelio(50)   # pieni neliö

penup()
goto(140, 150)
pendown()

nelio(100)  # iso neliö eri paikassa

penup()
goto(280, 150)
pendown()

nelio(150)  # vielä isompi!</pre>`,
        task: "Luo funktio <code>nelio(koko)</code> ja kutsu sitä kolmella eri koolla. <strong>Siirrä konnaa välissä</strong>, jotta saat kolme erillistä neliötä!",
        hint: "💡 def nelio(koko): for i in range(4): forward(koko); left(90). Sitten nelio(50), penup(), goto(140, 150), pendown(), nelio(100) jne.",
        starterCode: `# Lisää (koko)-parametri tähän funktioon:\ndef nelio():\n    for i in range(4):\n        forward(80)\n        left(90)\n\n# 1. Lisää (koko) def nelio(koko):\n# 2. Korvaa forward(80) → forward(koko)\n# 3. Kutsu eri ko'oilla ja siirrä välissä\n`,
        validate(log, lines) {
            if (lines.length < 8) return { ok: false, msg: `💡 Piirsit ${lines.length} viivaa. Kutsu nelio()-funktiota vähintään 2 kertaa!` };
            const dists = lines.map(l => Math.round(l.dist / 10) * 10);
            const unique = new Set(dists);
            if (unique.size < 2) return { ok: false, msg: "💡 Eri kokoisia neliöitä! Kutsu nelio(50), nelio(100) jne. Nyt kaikki ovat saman kokoisia." };
            return { ok: true, msg: "✅ Eri kokoisia neliöitä! Parametrit hallussa!" };
        }
    },
    {
        title: "7. Parametri: kulma 🔄",
        theory: `<p>Nyt lisätään toinen parametri: <strong>kulma</strong>! Mitä tapahtuu jos neliön kulma ei ole 90°? Kokeillaan!</p>
<p><code>def nelio(koko, kulma):</code> — nyt funktiolla on kaksi sisääntuloa.</p>
<p>Jos kulma on 90° → neliö. Jos kulma on 72° → viisisakara. Jos kulma on 60° → kuusikulmio!</p>`,
        example: `<pre># Funktio kahdella parametrilla
def nelio(koko, kulma):
    for i in range(4):
        forward(koko)
        left(kulma)

home()  # aloita keskeltä
nelio(80, 90)  # neliö

penup(); goto(250, 150); pendown()
nelio(80, 72)  # ? kokeile!</pre>`,
        task: "Luo funktio <code>nelio(koko, kulma)</code>. Kokeile eri kulmia: 90, 80, 70, 60, 120. Mitä eri muotoja saat?",
        hint: "💡 def nelio(koko, kulma): ... left(kulma). Kokeile nelio(80, 70) — mikä muoto se on?",
        starterCode: `# Lisää (kulma)-parametri:\ndef nelio(koko):\n    for i in range(4):\n        forward(koko)\n        left(90)\n\n# 1. Lisää (kulma) → def nelio(koko, kulma):\n# 2. Korvaa left(90) → left(kulma)\n# 3. Kokeile nelio(80, 90) ja nelio(80, 72)\n`,
        validate(log, lines) {
            const turns = log.filter(e => e.type === 'turn');
            const angles = turns.map(t => Math.round((Math.abs(t.angle) % 360) / 5) * 5);
            const hasNon90 = angles.some(a => a !== 90 && a !== 180 && a !== 0);
            if (!hasNon90 && lines.length < 4) return { ok: false, msg: "💡 Materiaaleja puuttuu. Kopio funktio ja koita uudestaan." };
            if (!hasNon90 && lines.length >= 4) return { ok: false, msg: "💡 Kokeile eri kulmaa! 90° tekee neliön, mutta mitä tekee 80°, 70° tai 120°?" };
            return { ok: true, msg: "✅ Kokeilit eri kulmia! Löysitkö uusia muotoja?" };
        }
    },
    {
        title: "8. Funktio silmukassa 🔥",
        theory: `<p>Nyt yhdistetään kaikki! Kutsu funktiota <strong>silmukan sisällä</strong> ja käännä konnaa jokaisella kierroksella.</p>
<p>Tällä tekniikalla voit tehdä <strong>kukkakuvioita</strong>, <strong>mandeja</strong> ja hienoja <strong>symmetrisiä kuvioita</strong>!</p>`,
        example: `<pre>def nelio(koko, kulma):
    for i in range(4):
        forward(koko)
        left(kulma)

# 5 neliötä, jokaisen välissä käännös
for i in range(5):
    nelio(80, 72)
    left(72)   # 360/5 = 72 astetta</pre>`,
        task: "Kutsu neliö-funktiota <strong>silmukan sisällä</strong>. Piirrä vähintään 5 kertaa ja kokeile eri kulmia!",
        hint: "💡 for i in range(5): nelio(80, 72); left(72). Kokeile range(6) ja left(60)!",
        starterCode: `# Tässä on funktio aiemmasta:\ndef nelio(koko, kulma):\n    for i in range(4):\n        forward(koko)\n        left(kulma)\n\n# 1. Kutsu nelio()-funktiota for-silmukassa:\n# 2. Käännä jokaisen neliön välissä left(72)\n`,
        validate(log, lines) {

        example: `<pre># Mestari-teos: yhdistele vapautta!
# 🌳 Fraktaalipuu + 🌈 väri-graduaatti oksissa
# 🌀 Ruusunkäyrä taustalle
# 🎲 Satunnaiset tähdet yläpuolelle
# 📐 Koch-reuna alareunaan
#
# Ei sääntöjä — ole luova ja yhdistele
# kaikki oppimasi taidot yhteen!</pre>`,
        task: "Luo <strong>mestari-teos</strong>! Yhdistä vähintään 3 eri edistynyttä taitoa (esim. fraktaali + graduaatti + symmetria). Piirrä runsas, vaikuttava kuvio!",
        hint: "💡 Yhdistele: fraktaalipuu + Koch + ruusunkäyrä + mandala. Lisää värejä, pensizea ja satunnaisuutta!",
        starterCode: `# 👑 MESTARI-TEOS — kaikki taidot käyttöön!\n\n# Voit yhdistää vapaasti:\n# 🌳 Fraktaalipuu + 📐 Koch + 🌀 Ruusunkäyrä\n# 🪞 Mandala + 🎲 Satunnaisuus + 🌈 Väri-graduaatti\n# 🏛️ Monikulmiot + ✏️ Viivatyylit\n\n# 1. Luo tarvittavat funktiot (myös rekursiiviset!)\n# 2. Yhdistele vähintään 3 eri taitoa\n# 3. Värejä, pensizea, satunnaisuutta\n# 4. Ei sääntöjä — ole mestari! 🎨\n`,
        validate(log, lines) {
            const circles = log.filter(e => e.type === 'circle');
            const total = lines.length + circles.length;
            if (total < 40) return { ok: false, msg: "💡 Mestari-teos vaatii runsaasti elementtejä! Yhdistele fraktaalit, rekursio, värit ja symmetria." };
            const colors = log.filter(e => e.type === 'color').map(c => c.color);
            const uniqueColors = new Set(colors);
            if (uniqueColors.size < 2) return { ok: true, msg: "👑 MESTARI-TEOS valmis! Olet hallinnut rekursion, fraktaalit, polaarit, symmetrian ja värit. Lisää värejä teoksesta vielä vaikuttavampi! 🐢✨" };
            return { ok: true, msg: "👑 TÄYLLÄYMMÄRRYS! Olet nyt Turtle-MESTARI! Olet hallinnut: funktiot, rekursion, fraktaalit, polaarit, symmetrian, väri-graduaatit ja satunnaisuuden. 🐢✨🏆" };
        }
    }
];

let pyodide = null;
let currentStep = 0;
let turtleReady = false;
const passedSteps = new Set(JSON.parse(localStorage.getItem('turtleKouluPassed') || '[]'));
function savePassedSteps() { localStorage.setItem('turtleKouluPassed', JSON.stringify([...passedSteps])); }

// ── Pyodide Init ──
async function initPyodide() {
    try {
        pyodide = await loadPyodide();
        await initTurtleBridge();
        await new Promise(r => setTimeout(r, 500));
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('app').style.display = '';
        buildStepDots();
        const hashStep = parseInt(window.location.hash.replace('#',''));
        goToStep(isNaN(hashStep) ? 0 : Math.max(0, Math.min(STEPS.length - 1, hashStep - 1)));
    } catch(e) {
        document.querySelector('.loading-content p').textContent = 'Virhe 😢 Päivitä sivu!';
    }
}

async function initTurtleBridge() {
    await pyodide.runPythonAsync(`
from js import document
_canvas = document.getElementById("turtle-canvas")
_ctx = _canvas.getContext("2d")
_w = _canvas.width
_h = _canvas.height

_turtle_x = _w / 2
_turtle_y = _h / 2
_turtle_angle = 0
_turtle_pen = True
_turtle_color = "#4fc3f7"
_turtle_size = 2
_turtle_log = []

import math

def forward(n):
    global _turtle_x, _turtle_y
    rad = math.radians(_turtle_angle)
    nx = _turtle_x + n * math.cos(rad)
    ny = _turtle_y - n * math.sin(rad)
    if _turtle_pen:
        _ctx.beginPath()
        _ctx.moveTo(_turtle_x, _turtle_y)
        _ctx.lineTo(nx, ny)
        _ctx.strokeStyle = _turtle_color
        _ctx.lineWidth = _turtle_size
        _ctx.stroke()
    _turtle_log.append({"type": "line", "dist": n, "angle": _turtle_angle})
    _turtle_x, _turtle_y = nx, ny

def backward(n):
    forward(-n)

def left(a):
    global _turtle_angle
    _turtle_angle = (_turtle_angle + a) % 360
    _turtle_log.append({"type": "turn", "angle": a})

def right(a):
    global _turtle_angle
    _turtle_angle = (_turtle_angle - a) % 360
    _turtle_log.append({"type": "turn", "angle": -a})

def penup():
    global _turtle_pen
    _turtle_pen = False
    _turtle_log.append({"type": "penup"})

def pendown():
    global _turtle_pen
    _turtle_pen = True
    _turtle_log.append({"type": "pendown"})

def pensize(s):
    global _turtle_size
    _turtle_size = s

def pencolor(c):
    global _turtle_color
    _turtle_color = c
    _turtle_log.append({"type": "color", "color": c})

def goto(x, y):
    global _turtle_x, _turtle_y
    if _turtle_pen:
        _ctx.beginPath()
        _ctx.moveTo(_turtle_x, _turtle_y)
        _ctx.lineTo(x, y)
        _ctx.strokeStyle = _turtle_color
        _ctx.lineWidth = _turtle_size
        _ctx.stroke()
    _turtle_x, _turtle_y = x, y

def setpos(x, y):
    goto(x, y)

def home():
    global _turtle_x, _turtle_y, _turtle_angle
    _turtle_x = _w / 2
    _turtle_y = _h / 2
    _turtle_angle = 0

def circle(r):
    global _turtle_x, _turtle_y
    _ctx.beginPath()
    _ctx.arc(_turtle_x, _turtle_y, r, 0, 2*math.pi)
    _ctx.strokeStyle = _turtle_color
    _ctx.lineWidth = _turtle_size
    _ctx.stroke()
    _turtle_log.append({"type": "circle", "radius": r})

def t_clear():
    _ctx.clearRect(0, 0, _w, _h)
    home()
`);
    turtleReady = true;
}

function getTurtleLog() {
    try {
        return JSON.parse(pyodide.runPython('import json; json.dumps(_turtle_log)'));
    } catch(e) { return []; }
}
function getLogLines(log) {
    return log.filter(e => e.type === 'line').map(l => ({
        angle: l.angle, dist: l.dist,
        x1: 0, x2: 0, y1: 0, y2: 0
    }));
}

function clearCanvas() {
    if (pyodide) pyodide.runPython('t_clear()');
}

function clearWorkspace() {
    document.getElementById('code-editor').value = STEPS[currentStep].starterCode;
    clearCanvas();
    hideFeedback();
}

function hideFeedback() {
    const fb = document.getElementById('feedback-box');
    fb.className = ''; fb.style.display = 'none'; fb.innerHTML = '';
}

function showFeedback(ok, msg) {
    const fb = document.getElementById('feedback-box');
    fb.className = ok ? 'success' : 'hint';
    fb.style.display = 'block';
    fb.innerHTML = msg;
}

async function runCode() {
    if (!pyodide) return;
    const code = document.getElementById('code-editor').value;
    clearCanvas();
    pyodide.runPython('_turtle_log = []; home()');
    try {
        await pyodide.runPythonAsync(code);
    } catch(e) {
        showFeedback(false, '❌ Virhe koodissa: ' + (e.message || String(e)));
        return;
    }
    const log = getTurtleLog();
    const lines = log.filter(e => e.type === 'line');
    const step = STEPS[currentStep];
    const result = step.validate(log, lines);
    showFeedback(result.ok, result.msg);
    if (result.ok) {
        passedSteps.add(currentStep);
        savePassedSteps();
        document.getElementById('btn-next').disabled = false;
        updateStepDots();
        playFanfare();
        launchConfetti();
    }
}

function goToStep(n) {
    currentStep = n;
    if (window.location.hash !== '#' + (n + 1)) {
        history.replaceState(null, '', '#' + (n + 1));
    }
    const step = STEPS[n];
    document.getElementById('step-title').textContent = step.title;
    document.getElementById('step-theory').innerHTML = step.theory;
    document.getElementById('step-example').innerHTML = step.example;
    document.getElementById('step-task').innerHTML = step.task;
    document.getElementById('step-hint').innerHTML = step.hint;
    document.getElementById('code-editor').value = step.starterCode;
    document.getElementById('step-label').textContent = `Vaihe ${n+1} / ${STEPS.length}`;
    hideFeedback();
    clearCanvas();
    document.getElementById('btn-prev').disabled = (n === 0);
    document.getElementById('btn-next').textContent = (n === STEPS.length - 1) ? '🏆 Valmis!' : 'Seuraava ▶';
    document.getElementById('btn-next').disabled = !passedSteps.has(n);
    updateStepDots();
    document.getElementById('instructions-pane').scrollTop = 0;
}

function nextStep() {
    if (currentStep < STEPS.length - 1) goToStep(currentStep + 1);
}
function prevStep() {
    if (currentStep > 0) goToStep(currentStep - 1);
}

window.addEventListener('hashchange', () => {
    const hashStep = parseInt(window.location.hash.replace('#',''));
    if (!isNaN(hashStep)) {
        const target = Math.max(0, Math.min(STEPS.length - 1, hashStep - 1));
        if (target !== currentStep) goToStep(target);
    }
});

function buildStepDots() {
    const container = document.getElementById('step-dots');
    container.innerHTML = '';
    for (let i = 0; i < STEPS.length; i++) {
        const dot = document.createElement('span');
        dot.className = 'step-dot';
        dot.title = STEPS[i].title;
        dot.onclick = () => goToStep(i);
        container.appendChild(dot);
    }
}

function updateStepDots() {
    const dots = document.querySelectorAll('.step-dot');
    dots.forEach((d, i) => {
        d.className = 'step-dot';
        if (passedSteps.has(i)) d.classList.add('passed');
        if (i === currentStep) d.classList.add('active');
        else if (i < currentStep) d.classList.add('done');
    });
}

// ── Fanfare Sound Effect ──
function playFanfare() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [
            { freq: 523.25, start: 0.0,  dur: 0.15 },
            { freq: 659.25, start: 0.12, dur: 0.15 },
            { freq: 783.99, start: 0.24, dur: 0.15 },
            { freq: 1046.50, start: 0.36, dur: 0.4 },
        ];
        notes.forEach(n => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.value = n.freq;
            gain.gain.setValueAtTime(0, ctx.currentTime + n.start);
            gain.gain.linearRampToValueAtTime(0.3, ctx.currentTime + n.start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + n.start + n.dur);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(ctx.currentTime + n.start);
            osc.stop(ctx.currentTime + n.start + n.dur + 0.05);
        });
        setTimeout(() => ctx.close(), 1500);
    } catch(e) {}
}

// ── Confetti Effect ──
function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const particles = [];
    const colors = ['#e2b714', '#00d26a', '#4fc3f7', '#b388ff', '#ff6b6b', '#ff9800'];
    for (let i = 0; i < 120; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height - canvas.height,
            w: Math.random() * 10 + 5,
            h: Math.random() * 6 + 3,
            color: colors[Math.floor(Math.random() * colors.length)],
            vx: (Math.random() - 0.5) * 4,
            vy: Math.random() * 3 + 2,
            rotation: Math.random() * 360,
            rotSpeed: (Math.random() - 0.5) * 10
        });
    }
    let frame = 0;
    const maxFrames = 150;
    function animate() {
        if (frame >= maxFrames) { ctx.clearRect(0, 0, canvas.width, canvas.height); return; }
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = 1 - (frame / maxFrames);
            ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
            ctx.restore();
            p.x += p.vx;
            p.y += p.vy;
            p.vy += 0.05;
            p.rotation += p.rotSpeed;
        });
        frame++;
        requestAnimationFrame(animate);
    }
    animate();
}

// ── Tab-to-Indent ──
document.addEventListener('DOMContentLoaded', () => {
    const editor = document.getElementById('code-editor');
    if (!editor) return;
    editor.addEventListener('paste', function(e) {
        e.preventDefault();
        showFeedback(false, '✋ Koodikoulussa koodi pitää kirjoittaa itse, jotta se tarttuu sormiin! Liittäminen on estetty.');
    });
    editor.addEventListener('keydown', function(e) {
        if (e.key === 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            const indent = '    ';
            this.value = this.value.substring(0, start) + indent + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + indent.length;
        }
    });
});

initPyodide();
</script>
